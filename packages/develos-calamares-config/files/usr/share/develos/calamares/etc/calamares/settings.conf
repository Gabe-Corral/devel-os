---
modules-search: [ local, /usr/lib/calamares/modules ]
instances: []
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - shellprocess
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - umount
  - show:
      - finished
branding: develos
prompt-install: false
dont-chroot: false
