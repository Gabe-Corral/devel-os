LABEL develos_nbd
TEXT HELP
Boot the DevelOS live/install medium using NBD.
It allows you to install DevelOS or perform system maintenance.
ENDTEXT
MENU LABEL DevelOS live/install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

LABEL develos_nfs
TEXT HELP
Boot the DevelOS live medium using NFS.
It allows you to install DevelOS or perform system maintenance.
ENDTEXT
MENU LABEL DevelOS live/install medium (%ARCH%, NFS)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archiso_nfs_srv=${pxeserver}:/run/archiso/bootmnt cms_verify=y
SYSAPPEND 3

LABEL develos_http
TEXT HELP
Boot the DevelOS live medium using HTTP.
It allows you to install DevelOS or perform system maintenance.
ENDTEXT
MENU LABEL DevelOS live/install medium (%ARCH%, HTTP)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archiso_http_srv=http://${pxeserver}/ cms_verify=y
SYSAPPEND 3
